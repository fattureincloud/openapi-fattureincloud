name: Generate Postman Collection
on:
  repository_dispatch:
    types: [generate-postman]

jobs:
  generate-postman-collection:
    runs-on: ubuntu-latest
    steps:

      - id: checkout
        name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FATTUREINCLOUD_BOT_TOKEN }}

      - id: init-git
        name: Init GIT
        run: |
          git config --global user.email "info@fattureincloud.it"
          git config --global user.name "fattureincloud-bot"

      - id: setup-node
        name: Setup Node.js
        uses: actions/setup-node@v4


      - id: setup-libraries
        name: Install libraries
        run: |
          npm install -g yarn
          yarn global add swagger-merger openapi-to-postmanv2
          sudo apt update
          sudo apt upgrade
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - id: read-version
        name: Read OpenAPI spec version
        run: |
          API_VERSION=$(yq e '.info.version' ./openapi.yaml)
          echo "OpenAPI version: $API_VERSION"
          echo "api_version=$API_VERSION" >> $GITHUB_ENV

      - id: generate-postman-collection
        name: Generate Postman Collection
        run: |
          echo "Resolving OpenAPI Specification to a single file..."
          swagger-merger -i ./openapi.yaml -o ./openapi-resolved.yaml

          echo "Generating Postman collection..."
          openapi2postmanv2 -s ./openapi-resolved.yaml -o ./postman/fic-api.json -p -O folderStrategy=Tags,includeAuthInfoInExample=false

          echo "Removing single file..."
          rm ./openapi-resolved.yaml

      - id: create-pr
        name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "postman-${{ env.api_version }}"
          token: "${{ secrets.FATTUREINCLOUD_BOT_TOKEN }}"
          delete-branch: true
          base: master
          commit-message:  "chore: postman collection for version ${{ env.api_version }}"
          title: "Postman Collection for Version ${{ env.api_version }}"
          body: "New Postman Collection generated by Github Action from OpenAPI Spec ${{ env.api_version }}"

      - id: create-jira-issue
        name: Create Jira Issue
        if: steps.create-pr.outputs.pull-request-url != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          OPENAPI_VERSION: ${{ env.openapi_version }}
          SDK_NAME: "Postman Collection"
        run: |
          PAYLOAD=$(jq -n \
            --arg summary "${SDK_NAME} for API spec v${OPENAPI_VERSION}" \
            --arg pr_url "${PR_URL}" \
            --arg openapi_version "${OPENAPI_VERSION}" \
            --arg sdk_name "${SDK_NAME}" \
            '{
              fields: {
                project: { key: "BOE" },
                summary: $summary,
                issuetype: { name: "Story" },
                parent: { key: "BOE-841" },
                priority: { name: "Medium" },
                customfield_10016: 5,
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [{
                        type: "text",
                        text: ("This task tracks the release of the " + $sdk_name + " generated from OpenAPI Spec v" + $openapi_version + ". It has been automatically generated and a pull request has been opened for review.")
                      }]
                    },
                    {
                      type: "paragraph",
                      content: [
                        { type: "text", text: "Generated PR: " },
                        { type: "text", text: $pr_url, marks: [{ type: "link", attrs: { href: $pr_url } }] }
                      ]
                    }
                  ]
                }
              }
            }')
          curl -s -X POST \
            "${JIRA_BASE_URL}/rest/api/3/issue" \
            -H "Authorization: Basic $(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64)" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"

